services:
  mysql:
    profiles: ["bundled"]
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: craft
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci", "--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    image: yancraft-app:latest
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-101.132.141.162}
      MYSQL_PORT: ${MYSQL_PORT:-3307}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_URL: ${MYSQL_URL:-jdbc:mysql://101.132.141.162:3307/craft?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
      TZ: Asia/Shanghai
    ports:
      - "3001:3001"
      - "3000:3000"
    volumes:
      - upload-data:/data/upload

volumes:
  mysql-data:
  upload-data:
